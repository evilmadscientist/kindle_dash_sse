<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Real-Time Pacific Time (NTP)</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				text-align: center;
				margin-top: 80px;
			}
			#time {
				font-size: 6em;
				margin-top: 20px;
				font-weight: bold;
			}
			#date {
				font-size: 3em;
				margin-top: 20px;
			}
			#weather {
				font-size: 1.5em;
				margin-top: 20px;
			}
		</style>

	</head>
	<body>
		<div id="time">Loading time...</div>
		<div id="date">Loading date...</div>
		<div id="weather">Loading weather...</div>
		<!-- Add lines to allow for scrolling -->
		<p><br><br><br><br><br></p>
		<script>
			<!-- Updates the time element -->
			const timeEl = document.getElementById("time");
			const timeStream = new EventSource("http://127.0.0.1:5000/stream_time");

			timeStream.onmessage = (event) => {
				timeEl.textContent = event.data;
			};

			timeStream.onerror = () => {
				timeEl.textContent = "Connection lost...";
			};

			<!-- Updates the date element -->
			const dateEl = document.getElementById("date");
			const dateStream = new EventSource("http://127.0.0.1:5000/stream_date");

			dateStream.onmessage = (event) => {
				dateEl.textContent = event.data;
			};

			dateStream.onerror = () => {
				dateEl.textContent = "Connection lost...";
			};

			<!-- Updates the weather element -->
			const weatherEl = document.getElementById("weather");
			const weatherStream = new EventSource("http://127.0.0.1:5000/stream_weather");

			weatherStream.onmessage = (event) => {
				weatherEl.textContent = event.data;
			};

			weatherStream.onerror = () => {
				weatherEl.textContent = "Connection lost...";
			};
		</script>
	</body>
</html>
